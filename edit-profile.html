<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile — PC Word</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <nav class="nav">
      <div class="logo">
        <a href="index.html"><span class="logo-mark"></span>PC Word</a>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="homepage.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-pill" aria-label="View cart">
          🛒
          <span class="cart-count" id="cartCount">0</span>
        </a>
        <a href="login.html" class="btn btn-ghost btn-sm" id="authNavLink">Sign In</a>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-section">
      <div class="wrap" style="max-width: 560px;">
        <span class="eyebrow">Account</span>
        <h1 style="margin: var(--sp-3) 0 var(--sp-5);">Edit Profile</h1>

        <div class="glass-panel fade-up" style="padding: var(--sp-6);">
          <form id="editProfileForm" novalidate>
            <div class="field">
              <label for="name">Full Name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="field">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" disabled />
              <span class="field-hint">Email can't be changed here.</span>
            </div>
            <div class="field">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone" required />
            </div>

            <p id="editError" class="field-error" style="margin-bottom: var(--sp-3);"></p>

            <div class="flex-between" style="gap: var(--sp-3);">
              <a href="profile.html" class="btn btn-ghost" style="flex:1;">Cancel</a>
              <button type="submit" class="btn btn-primary" style="flex:1;">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© 2026 PC Word. Built for people who build their own PCs.</p>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
  <script type="module" src="js/auth.js"></script>
  <!-- Account profile logic is handled by js/auth.js using Firebase. -->
</body>
</html>
