<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — PC Word</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <nav class="nav">
      <div class="logo">
        <a href="index.html"><span class="logo-mark"></span>PC Word</a>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="homepage.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <div class="nav-actions">
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <main class="auth-shell">
    <div class="glass-panel auth-card fade-up">
      <h1>Welcome back</h1>
      <p class="auth-sub">Sign in to continue to PC Word.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required />
        </div>

        <p id="authError" class="field-error" style="margin-bottom: var(--sp-3);"></p>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div class="auth-links">
        <span>New to PC Word? <a href="signup.html">Create an account</a></span>
        <span><a href="forgot.html">Forgot your password?</a></span>
      </div>
    </div>
  </main>

  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
