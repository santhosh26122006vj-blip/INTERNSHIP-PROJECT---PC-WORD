<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — PC Word</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <nav class="nav">
      <div class="logo">
        <a href="index.html"><span class="logo-mark"></span>PC Word</a>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="homepage.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <div class="nav-actions">
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <main class="auth-shell">
    <div class="glass-panel auth-card fade-up">
      <h1>Create your account</h1>
      <p class="auth-sub">Join PC Word to track orders and check out faster.</p>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required />
        </div>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" required />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required />
          </div>
        </div>

        <p id="authError" class="field-error" style="margin-bottom: var(--sp-3);"></p>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <div class="auth-links">
        <span>Already have an account? <a href="login.html">Sign in</a></span>
      </div>
    </div>
  </main>

  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
