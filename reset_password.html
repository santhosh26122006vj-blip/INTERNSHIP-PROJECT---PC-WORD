<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — PC Word</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <nav class="nav">
      <div class="logo">
        <a href="index.html"><span class="logo-mark"></span>PC Word</a>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="homepage.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <div class="nav-actions">
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <main class="auth-shell">
    <div class="glass-panel auth-card fade-up">
      <p class="field-hint">Use the secure password reset link sent to your email by Firebase.</p>
        <h1>Reset your password</h1>
      <p class="auth-sub">Choose a new password for your account.</p>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="At least 6 characters" required />
        </div>
        <div class="field">
          <label for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Re-enter password" required />
        </div>
        <p id="resetMessage" class="field-error" style="margin-bottom: var(--sp-3);"></p>
        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>

      <div class="auth-links">
        <span><a href="login.html">Back to Sign In</a></span>
      </div>
    </div>
  </main>

  <script src="js/products.js"></script>
  <script src="js/script.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script>
    const form = document.getElementById('resetForm');
    if (form) {
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const message = document.getElementById('resetMessage');
        message.textContent = 'For security, use the password-reset link sent by Firebase to your email. If you have not requested one, visit Forgot Password.';
      });
    }
  </script>
</body>
</html>
